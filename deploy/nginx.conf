# =============================================================
#  nginx cho giongnoiso.com
#  Dat tai: /www/server/panel/vhost/nginx/giongnoiso.com.conf
#  (hoac /etc/nginx/conf.d/giongnoiso.com.conf neu khong dung aaPanel)
# =============================================================

# Gioi han so request tao tai khoan / dang nhap tu mot IP
limit_req_zone $binary_remote_addr zone=gns_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gns_api:10m  rate=120r/m;

upstream giongnoiso_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- Chuyen huong HTTP sang HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name giongnoiso.com www.giongnoiso.com;

    # Cho phep Let's Encrypt xac thuc
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/giongnoiso.com/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name giongnoiso.com www.giongnoiso.com;

    ssl_certificate     /www/server/panel/vhost/cert/giongnoiso.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/giongnoiso.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Ban ghi am co the vai MB -> cho phep body 15MB
    client_max_body_size 15m;
    client_body_timeout  60s;

    access_log /www/wwwlogs/giongnoiso.com.access.log;
    error_log  /www/wwwlogs/giongnoiso.com.error.log warn;

    # --- Lop chan thu hai: cac duong dan nhay cam khong bao gio ra ngoai ---
    # Ung dung da chan san, day la phong tuyen du phong.
    location ~ /\. {
        deny all;
        access_log off;
        return 404;
    }
    location ~* ^/(server\.js|package\.json|package-lock\.json)$ {
        deny all;
        return 404;
    }
    location ~* ^/(lib|db|scripts|deploy|node_modules|logs|scratch|cloned_repo|nodejs|NHGNSBTT)/ {
        deny all;
        return 404;
    }
    location ~* \.(env|sql|sh|bat|exe|log|md)$ {
        deny all;
        return 404;
    }

    # --- Han che nhip dang nhap / dang ky ---
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=gns_auth burst=5 nodelay;
        proxy_pass http://giongnoiso_app;
        include /etc/nginx/proxy_params_gns.conf;
    }

    # --- Chatbot dung SSE: phai tat buffer ---
    location ~ ^/api/(chatbot|chat)$ {
        proxy_pass http://giongnoiso_app;
        include /etc/nginx/proxy_params_gns.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        limit_req zone=gns_api burst=40 nodelay;
        proxy_pass http://giongnoiso_app;
        include /etc/nginx/proxy_params_gns.conf;
    }

    # --- File am thanh nguoi dung tai len ---
    location /uploads/ {
        proxy_pass http://giongnoiso_app;
        include /etc/nginx/proxy_params_gns.conf;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- Tai nguyen tinh: nginx phuc vu truc tiep cho nhanh ---
    location / {
        root /www/wwwroot/giongnoiso.com/public;
        try_files $uri $uri/ @app;

        location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    location @app {
        proxy_pass http://giongnoiso_app;
        include /etc/nginx/proxy_params_gns.conf;
    }
}
